<div class="container-fluid">
    <form action="" id="user-form">
        <input type="hidden" name="id" value="{% if user.pk %}{{ user.pk }}{% endif %}">
        
        <div class="form-group mb-3">
            <label for="first_name" class="control-label">Prénom</label>
            <input type="text" name="first_name" id="first_name" class="form-control form-control-sm rounded-0" value="{% if user.first_name %}{{ user.first_name }}{% endif %}" >
        </div>
        
        <div class="form-group mb-3">
            <label for="last_name" class="control-label">Nom</label>
            <input type="text" name="last_name" id="last_name" class="form-control form-control-sm rounded-0" value="{% if user.last_name %}{{ user.last_name }}{% endif %}" >
        </div>
        <div class="form-group mb-3">
            <label for="username" class="control-label">Nom d'utilisateur</label>
            <input type="text" name="username" id="username" class="form-control form-control-sm rounded-0" value="{% if user.username %}{{ user.username }}{% endif %}" >
        </div>
        
        <div class="form-group mb-3">
            <label for="email" class="control-label">Email</label>
            <input type="email" name="email" id="email" class="form-control form-control-sm rounded-0" value="{% if user.email %}{{ user.email }}{% endif %}" >
        </div>
        
        <div class="form-group mb-3">
            <label for="user_type" class="control-label">Type d'utilisateur</label>
            <select name="user_type" id="user_type" class="form-select form-select-sm rounded-0" >
                {% if not user.user_type %}
                <option value="" disabled selected>Choisissez un type</option>
                {% endif %}
                <option value="employe" {% if user.user_type == 0 %}selected{% endif %}>Employe</option>
                <option value="binome" {% if user.user_type == 2 %}selected{% endif %}>Binôme</option>
                <option value="admin" {% if user.user_type == 1 %}selected{% endif %}>Superuser</option>
            </select>
        </div>
        
        <div class="form-group mb-3">
            <label for="password" class="control-label">Mot de Passe</label>
            <input type="password" name="password" id="password" class="form-control form-control-sm rounded-0" >
        </div>
        
        <div class="form-group mb-3">
            <label for="status" class="control-label">Statut</label>
            <select name="status" id="status" class="form-select form-select-sm rounded-0" >
                {% if user.status and user.status == 1 %}
                <option value="1" selected>Actif</option>
                {% else %}
                <option value="1">Actif</option>
                {% endif %}

                {% if user.status and user.status == 0 %}
                <option value="0" selected>Inactif</option>
                {% else %}
                <option value="0">Inactif</option>
                {% endif %}
            </select>
        </div>
    </form>
</div>

<script>
    $(function() {
        $('#user-form').submit(function(e) {
            e.preventDefault();
            var _this = $(this)
            $('.err-msg').remove();
            var el = $('<div>')
            el.addClass("alert alert-danger err-msg")
            el.hide()
            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }
            start_loader();
            $.ajax({
                headers: {
                    "X-CSRFToken": '{{ csrf_token }}'
                },
                url: "{% url 'save-user-page' %}",
                data: new FormData($(this)[0]),
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err)
                    end_loader();
                },
                success: function(resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        el.removeClass("alert alert-danger err-msg")
                        location.reload()
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.text(resp.msg)
                    } else {
                        el.text("Une erreur s'est produite");
                        end_loader();
                        console.err(resp)
                    }
                    _this.prepend(el)
                    el.show('slow')
                    $("html, body, .modal").scrollTop(0);
                    end_loader()
                }
            })
        })
    })
</script>
